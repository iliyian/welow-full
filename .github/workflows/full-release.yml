name: Full Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF_NAME}
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "WeFlow $TAG (full build)" --notes "Full build with bundled native components." --target "$GITHUB_SHA"
          fi

  windows-x64:
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Sync version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: |
          npx tsc
          npx vite build
      - name: Package unpacked
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Patch wcdb_api.dll expiry
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File patches/patch_wcdb.ps1 -AppDir release2/win-unpacked
      - name: Package installer
        run: npx electron-builder --win nsis --x64 --prepackaged release2/win-unpacked --publish never --config.artifactName=WeFlow-${GITHUB_REF_NAME#v}-x64-Setup.${ext}
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" release2/*x64*Setup.exe release2/latest.yml --clobber --repo "$GITHUB_REPOSITORY" || true

  linux-x64:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Sync version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build and package
        run: |
          npx tsc
          npx vite build
          npx electron-builder --linux --x64 --publish never --config.artifactName=WeFlow-${GITHUB_REF_NAME#v}-linux-x64-Setup.${ext}
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release2/*linux*x64* --clobber --repo "$GITHUB_REPOSITORY" || true

  mac-arm64:
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Sync version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx tsc
          npx vite build
          npx electron-builder --mac dmg zip --arm64 --publish never --config.npmRebuild=false --config.artifactName=WeFlow-${GITHUB_REF_NAME#v}-mac-arm64-Setup.${ext}
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release2/*mac*Setup.* release2/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY" || true
